<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Panel Staf Teras Rumah</title>
<style>
:root{--bg:#fbfaf6;--card:#fff;--ink:#26332b;--mu:#6a766d;--ln:#e3e6dc;--gr:#6f9d84;--so:#e8f0ea;--rd:#d9534f}
@media(prefers-color-scheme:dark){:root{--bg:#17201b;--card:#1f2b24;--ink:#eef1e9;--mu:#a3b0a6;--ln:#2f3d34;--so:#243329}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg)}main{max-width:900px;margin:0 auto;padding:14px}
.box{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}input{width:100%;padding:9px;border:1px solid var(--ln);border-radius:8px;font:inherit;background:var(--bg);color:var(--ink);margin:4px 0 10px}
.btn{background:var(--gr);color:#10201a;border:0;border-radius:10px;padding:8px 14px;font:700 14px system-ui;cursor:pointer;margin:2px}.g2{background:var(--so);color:var(--ink)}.r{background:var(--rd);color:#fff}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--so);font-size:12px;font-weight:700}.ok{background:#bfe3cd;color:#143}.w{background:#fbe3a8;color:#541}.x{background:#f3c9c6;color:#611}
.bk{max-width:220px;border-radius:8px;display:block;margin:6px 0}.new{background:#fbe3a8;color:#541;padding:10px;border-radius:10px;margin-bottom:12px;font-weight:700}.err{color:var(--rd)}.mu{color:var(--mu);font-size:13px}
</style></head><body>
<header><b>☕ Teras Rumah · Panel Staf</b><button class="btn g2" id="lo" style="display:none" onclick="auth.signOut()">Keluar</button></header><main id="m"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const FB={apiKey:"ISI_API_KEY",authDomain:"ISI_PROJECT_ID.firebaseapp.com",projectId:"",appId:"ISI_APP_ID"},ADMIN=["admin@contoh.com"];
const rp=n=>"Rp "+(+n||0).toLocaleString("id-ID"),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const SB={belum:"Belum dibayar",menunggu:"Menunggu verifikasi",lunas:"Lunas"},SS={baru:"Baru",diproses:"Diproses",siap:"Siap",selesai:"Selesai",dibatalkan:"Dibatalkan"},MT={tunai:"Tunai",transfer:"Transfer",qris:"QRIS"},NX={baru:"diproses",diproses:"siap",siap:"selesai"};
const tot=o=>(o.items||[]).reduce((a,i)=>a+i.p*i.q,0);
let U=null,L=[],first=true,unsub=null,err="",banner="",ac=null;
if(!FB.projectId){document.getElementById("m").innerHTML='<div class="box err">Konfigurasi Firebase belum diisi.</div>'}else{
firebase.initializeApp(FB);var auth=firebase.auth(),db=firebase.firestore();
auth.onAuthStateChanged(u=>{U=u;if(unsub){unsub();unsub=null}L=[];if(u){first=true;unsub=db.collection("pesanan").orderBy("w","desc").limit(100).onSnapshot(s=>{if(!first&&s.docChanges().some(c=>c.type=="added")){ring();banner="🔔 Ada pesanan baru!"}first=false;L=s.docs.map(d=>d.data());err="";draw()},e=>{err="Tidak bisa membaca pesanan: "+e.message;draw()})}draw()});}
function ring(){try{ac=ac||new AudioContext();[0,.25].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.value=.2;o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.15)})}catch(e){}if(navigator.vibrate)navigator.vibrate(300)}
function login(){err="";auth.signInWithEmailAndPassword(document.getElementById("e").value.trim(),document.getElementById("p").value).catch(()=>{err="Email atau password salah.";draw()})}
function upd(k,f,v){db.collection("pesanan").doc(k).update({[f]:v}).catch(e=>alert("Gagal: "+e.message))}
function draw(){document.getElementById("lo").style.display=U?"":"none";const m=document.getElementById("m");
if(!U){m.innerHTML=`<div class="box"><h2>Login staf</h2><label>Email</label><input id="e" type="email" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password"><p class="err">${esc(err)}</p><button class="btn" onclick="login()">Masuk</button></div>`;return}
const adm=ADMIN.includes(U.email),om=L.filter(o=>o.sb=="lunas"&&o.ss!="dibatalkan").reduce((a,o)=>a+tot(o),0),nb=L.filter(o=>o.ss=="baru").length;
m.innerHTML=(banner?`<div class="new" onclick="banner='';draw()">${banner} (ketuk untuk menutup)</div>`:"")+(err?`<p class="err">${esc(err)}</p>`:"")+`<div class="box"><b>${adm?"Admin":"Kasir"}</b> · Pesanan baru: <b>${nb}</b> · Total: ${L.length} · Omzet lunas: <b>${rp(om)}</b><p class="mu">Halaman diperbarui otomatis saat ada pesanan masuk.</p></div>`+
(L.map(o=>`<div class="box"><b>${esc(o.k)}</b> · ${esc(o.nm)} (${esc(o.hp)}) · ${o.tp=="bawa_pulang"?"Bawa pulang":"Meja "+esc(o.mz||"-")}<br>${(o.items||[]).map(i=>i.q+"× "+esc(i.n)).join(", ")}<br>${o.ct?esc(o.ct)+"<br>":""}<b>${rp(tot(o))}</b> · ${MT[o.mt]||""}<br><span class="pill ${o.ss=="selesai"?"ok":o.ss=="dibatalkan"?"x":"w"}">${SS[o.ss]||o.ss}</span> <span class="pill ${o.sb=="lunas"?"ok":o.sb=="menunggu"?"w":""}">${SB[o.sb]||o.sb}</span>${o.bk?`<img class="bk" src="${o.bk}" alt="Bukti">`:""}<p>${o.sb!="lunas"&&o.ss!="dibatalkan"?`<button class="btn" onclick="upd('${esc(o.k)}','sb','lunas')">Verifikasi / Lunas</button>`:""}${NX[o.ss]?`<button class="btn g2" onclick="upd('${esc(o.k)}','ss','${NX[o.ss]}')">→ ${SS[NX[o.ss]]}</button>`:""}${adm&&o.ss!="dibatalkan"&&o.ss!="selesai"?`<button class="btn r" onclick="if(confirm('Batalkan pesanan?'))upd('${esc(o.k)}','ss','dibatalkan')">Batalkan</button>`:""}</p></div>`).join("")||"<p>Belum ada pesanan.</p>")}
draw();
</script></body></html>
